<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Paciente - Vet Murphy</title>
    <link rel="stylesheet" th:href="@{/estilosAdmin.css}">
</head>
<body class="cuerpo-admin">

    <aside class="menu-lateral">
        <div class="logo-admin">
            <h2>Vet Murphy</h2>
            <p>Panel Veterinario</p>
        </div>
        <nav class="navegacion-admin">
            <a href="/dashboard">Inicio (Dashboard)</a>
            <a href="/consultas">Consultas Médicas</a>
            <a href="/animales" class="activo">Pacientes (Clínica/Campo)</a>
            <a href="/inventario">Inventario</a>
        </nav>
    </aside>

    <main class="contenido-principal">
        <header class="cabecera-dashboard">
            <h1>Registrar Nuevo Paciente</h1>
            <p>Ingresa los datos de la mascota o animal de producción</p>
        </header>

        <section class="panel-formulario">
            <form action="#" method="POST" class="formulario-estilizado">
                
                <h3 class="titulo-seccion-form">1. Identificación Principal</h3>
                <div class="fila-inputs">
                    <div class="grupo-input">
                        <label for="id_dueno">Dueño / Propietario *</label>
                        <select id="id_dueno" name="id_dueno" required>
                            <option value="" disabled selected>Seleccione un cliente...</option>
                            <option value="1">Juan Pérez (Comunidad El Rosal)</option>
                            <option value="2">María Gómez (Calle Central)</option>
                        </select>
                    </div>
                    
                    <div class="grupo-input">
                        <label for="especie">Especie *</label>
                        <select id="especie" name="especie" required>
                            <option value="" disabled selected>Seleccione...</option>
                            <option value="Canino">Canino (Perro)</option>
                            <option value="Felino">Felino (Gato)</option>
                            <option value="Bovino">Bovino (Vaca/Toro)</option>
                            <option value="Porcino">Porcino (Cerdo)</option>
                            <option value="Equino">Equino (Caballo)</option>
                        </select>
                    </div>
                </div>

                <div class="fila-inputs">
                    <div class="grupo-input">
                        <label for="nombre">Nombre o Arete (Tag) *</label>
                        <input type="text" id="nombre" name="nombre_o_identificador" placeholder="Ej. Luna o TAG-098" required>
                    </div>
                    <div class="grupo-input">
                        <label for="raza">Raza</label>
                        <input type="text" id="raza" name="raza" placeholder="Ej. Poodle, Brahman...">
                    </div>
                </div>

                <h3 class="titulo-seccion-form">2. Detalles Físicos y Clínicos</h3>
                <div class="fila-inputs">
                    <div class="grupo-input">
                        <label for="sexo">Sexo *</label>
                        <select id="sexo" name="sexo" required>
                            <option value="Macho">Macho</option>
                            <option value="Hembra">Hembra</option>
                        </select>
                    </div>
                    <div class="grupo-input">
                        <label for="fecha_nac">Fecha de Nacimiento</label>
                        <input type="date" id="fecha_nac" name="fecha_nacimiento">
                    </div>
                </div>

                <div class="fila-inputs">
                    <div class="grupo-input">
                        <label for="peso">Peso Referencial (Kg)</label>
                        <input type="number" step="0.1" id="peso" name="peso_referencial" placeholder="Ej. 450.5">
                    </div>
                    <div class="grupo-input">
                        <label for="color">Color / Pelaje</label>
                        <input type="text" id="color" name="color_pelaje" placeholder="Ej. Manchado, Negro...">
                    </div>
                </div>

                <h3 class="titulo-seccion-form">3. Datos Específicos</h3>
                <div class="fila-inputs">
                    <div class="grupo-input">
                        <label for="esterilizado">¿Está Esterilizado? (Mascotas)</label>
                        <select id="esterilizado" name="esterilizado">
                            <option value="" selected>Desconocido / No aplica</option>
                            <option value="true">Sí</option>
                            <option value="false">No</option>
                        </select>
                    </div>
                    <div class="grupo-input">
                        <label for="proposito">Propósito (Ganado)</label>
                        <select id="proposito" name="proposito_produccion">
                            <option value="" selected>No aplica (Mascota)</option>
                            <option value="Carne">Producción de Carne</option>
                            <option value="Leche">Producción de Leche</option>
                            <option value="Doble">Doble Propósito</option>
                        </select>
                    </div>
                </div>

                <div class="acciones-formulario">
                    <button type="button" class="btn-secundario" onclick="window.history.back();">Cancelar</button>
                    <button type="button" class="btn-primario" onclick="alert('Modo visual: Los datos no se han guardado en MySQL.');">Guardar Paciente</button>
                </div>
            </form>
        </section>
    </main>

</body>
</html>
